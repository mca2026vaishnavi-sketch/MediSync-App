
name: Build MediSync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Check project files
        working-directory: MediSync-main
        run: |
          echo "Checking MediSync project..."
          ls -la
          test -f gradlew
          test -f settings.gradle.kts
          test -d app
          echo "Project files found."

      - name: Build MediSync APK
        working-directory: MediSync-main
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh MediSync-main/app/build/outputs/apk/debug/
          test -f MediSync-main/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediSync-debug-apk
          path: MediSync-main/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
